name: CI Unit

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unit-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: unit-integration/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: >
          pytest unit
          --cov --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-integration/junit.xml
            unit-integration/coverage.xml
            unit-integration/htmlcov/